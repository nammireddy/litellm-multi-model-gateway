apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-service
  namespace: glm-chat
  labels:
    app: qwen3-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-service
  template:
    metadata:
      labels:
        app: qwen3-service
    spec:
      nodeSelector:
        workload: gpu-qwen3
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.5
          args:
            - "--model"
            - "Qwen/Qwen2.5-14B-Instruct-AWQ"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--trust-remote-code"
            - "--quantization"
            - "awq"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              value: ""  # Add HF token if needed
          resources:
            requests:
              cpu: "2"
              memory: "12Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "15Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 360
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-service
  namespace: glm-chat
spec:
  selector:
    app: qwen3-service
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
